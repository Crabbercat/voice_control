<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vietnamese Voice Test</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17212b;
            --muted: #63707a;
            --paper: #f5f1e8;
            --panel: #fffdf8;
            --accent: #c84b31;
            --accent-dark: #9e3522;
            --line: #ded6c8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient(circle at 15% 15%, #fff9ec 0 16%, transparent 42%), var(--paper);
        }
        main {
            width: min(100%, 560px);
            padding: clamp(28px, 7vw, 58px);
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 12px 14px 0 #e5dccd;
        }
        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font: 700 0.78rem/1.2 Arial, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.3rem); line-height: 0.98; }
        .intro { margin: 18px 0 32px; color: var(--muted); font: 1rem/1.5 Arial, sans-serif; }
        button {
            width: 100%;
            min-height: 54px;
            border: 0;
            border-radius: 3px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font: 700 1rem Arial, sans-serif;
        }
        button:hover { background: var(--accent-dark); }
        button:disabled { cursor: wait; opacity: 0.6; }
        .status { margin: 22px 0 30px; padding-top: 18px; border-top: 1px solid var(--line); font: 0.95rem Arial, sans-serif; }
        .label { margin: 0 0 10px; color: var(--muted); font: 700 0.78rem Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
        #transcript { min-height: 2.2em; margin: 0; font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1.2; overflow-wrap: anywhere; }
        .action { margin-top: 28px; }
        #command { margin: 0; color: var(--accent); font: 700 1.35rem Arial, sans-serif; letter-spacing: 0.04em; }
        .error { color: var(--accent-dark); }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Local Wav2Vec2 test</p>
        <h1>Vietnamese Voice Test</h1>
        <p class="intro">Speak clearly into your microphone, then stop to transcribe the recording.</p>
        <button id="recordButton" type="button">Record</button>
        <p class="status" id="status" aria-live="polite">Status: Ready</p>
        <p class="label">Recognized text</p>
        <p id="transcript" aria-live="polite">&mdash;</p>
        <div class="action">
            <p class="label">Action</p>
            <p id="command" aria-live="polite">&mdash;</p>
        </div>
    </main>
    <script>
        const recordButton = document.querySelector("#recordButton");
        const status = document.querySelector("#status");
        const transcript = document.querySelector("#transcript");
        const command = document.querySelector("#command");
        let recorder;
        let stream;
        let chunks = [];

        function setStatus(message, isError = false) {
            status.textContent = `Status: ${message}`;
            status.classList.toggle("error", isError);
        }

        function supportedMimeType() {
            const types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
            return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
        }

        async function startRecording() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = supportedMimeType();
                recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                chunks = [];
                recorder.addEventListener("dataavailable", (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                });
                recorder.addEventListener("stop", sendRecording, { once: true });
                recorder.start();
                recordButton.textContent = "Stop";
                setStatus("Recording...");
            } catch (error) {
                setStatus(error.message || "Microphone permission was denied.", true);
                stopStream();
            }
        }

        function stopRecording() {
            if (recorder && recorder.state === "recording") recorder.stop();
            stopStream();
            recordButton.disabled = true;
            recordButton.textContent = "Record";
            setStatus("Processing...");
        }

        function stopStream() {
            if (stream) stream.getTracks().forEach((track) => track.stop());
            stream = undefined;
        }

        async function sendRecording() {
            try {
                const mimeType = recorder.mimeType || "audio/webm";
                const audio = new Blob(chunks, { type: mimeType });
                const extension = mimeType.includes("ogg") ? "ogg" : "webm";
                const formData = new FormData();
                formData.append("audio", audio, `recording.${extension}`);
                const response = await fetch("/recognize", { method: "POST", body: formData });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.error || "Recognition failed.");
                transcript.textContent = result.text || "(No speech detected)";
                command.textContent = result.command || "UNKNOWN";
                setStatus(`Recognized: ${result.text || "(No speech detected)"}`);
            } catch (error) {
                setStatus(error.message, true);
            } finally {
                recordButton.disabled = false;
            }
        }

        recordButton.addEventListener("click", () => {
            if (recorder && recorder.state === "recording") stopRecording();
            else startRecording();
        });
    </script>
</body>
</html>
